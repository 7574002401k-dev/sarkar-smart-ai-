<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarkar Smart AI</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chat-container">

    <div class="header">
        🤖 Sarkar Smart AI
    </div>

    <div id="chatBox" class="chat-box">

        <div class="bot">
            👋 Hello! Welcome to Sarkar Smart AI.
        </div>

    </div>

    <div class="input-area">

        <input
        type="text"
        id="userInput"
        placeholder="Ask anything...">

        <button id="sendBtn">
            Send
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
